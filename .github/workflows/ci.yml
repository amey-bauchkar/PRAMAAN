name: CI

on:
  push:
    branches: [ main, 'fix/**', 'feat/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-tests:
    name: Build, lint, typecheck and offline tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Offline tests
        run: npm run test:offline

  isolated-postgres-integration:
    name: PostgreSQL 17 integration and RLS
    runs-on: ubuntu-latest
    env:
      ALLOW_DESTRUCTIVE_DB_TESTS: "true"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_admin_password
          POSTGRES_DB: pramaan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: node scripts/migrate-supabase.mjs
        env:
          DATABASE_URL_ADMIN: postgresql://postgres:ci_test_admin_password@localhost:5432/pramaan_test

      - name: Re-apply migrations (idempotency)
        run: node scripts/migrate-supabase.mjs
        env:
          DATABASE_URL_ADMIN: postgresql://postgres:ci_test_admin_password@localhost:5432/pramaan_test

      - name: Set runtime role password
        run: |
          node -e "
            import pg from 'pg';
            const pool = new pg.Pool({ connectionString: 'postgresql://postgres:ci_test_admin_password@localhost:5432/pramaan_test' });
            await pool.query(\"ALTER ROLE pramaan_app_user WITH PASSWORD 'ci_runtime_password';\");
            await pool.end();
          "

      - name: Seed demo tenant
        run: node scripts/seed-demo.mjs
        env:
          DATABASE_URL_ADMIN: postgresql://postgres:ci_test_admin_password@localhost:5432/pramaan_test

      - name: Migration runner tests
        run: npx vitest run db/tests/migration-runner.test.ts
        env:
          DATABASE_URL_ADMIN: postgresql://postgres:ci_test_admin_password@localhost:5432/pramaan_test

      - name: Audit chain and consent tests
        run: npx vitest run apps/api/tests/audit-concurrency-and-consent.test.ts
        env:
          DATABASE_URL: postgresql://pramaan_app_user:ci_runtime_password@localhost:5432/pramaan_test
          DATABASE_URL_ADMIN: postgresql://postgres:ci_test_admin_password@localhost:5432/pramaan_test

      - name: Consent adversarial tests
        run: npx vitest run apps/api/tests/consent-adversarial.test.ts
        env:
          DATABASE_URL: postgresql://pramaan_app_user:ci_runtime_password@localhost:5432/pramaan_test
          DATABASE_URL_ADMIN: postgresql://postgres:ci_test_admin_password@localhost:5432/pramaan_test

      - name: Runtime role and RLS tests
        run: npx vitest run apps/api/tests/restricted-runtime-user.test.ts
        env:
          DATABASE_URL: postgresql://pramaan_app_user:ci_runtime_password@localhost:5432/pramaan_test
          DATABASE_URL_ADMIN: postgresql://postgres:ci_test_admin_password@localhost:5432/pramaan_test

      - name: Connection pool isolation tests
        run: npx vitest run db/tests/connection-pool-reuse.test.ts
        env:
          DATABASE_URL: postgresql://pramaan_app_user:ci_runtime_password@localhost:5432/pramaan_test
          DATABASE_URL_ADMIN: postgresql://postgres:ci_test_admin_password@localhost:5432/pramaan_test

      - name: RLS invariants
        run: npx vitest run db/tests/supabase-real-db.test.ts
        env:
          DATABASE_URL_ADMIN: postgresql://postgres:ci_test_admin_password@localhost:5432/pramaan_test

      - name: Durable repository tests
        run: npx vitest run db/tests/p0-04-pg-durable-repositories.test.ts
        env:
          DATABASE_URL: postgresql://pramaan_app_user:ci_runtime_password@localhost:5432/pramaan_test
          DATABASE_URL_ADMIN: postgresql://postgres:ci_test_admin_password@localhost:5432/pramaan_test

  live-supabase-verification:
    name: Live Supabase verification
    runs-on: ubuntu-latest
    env:
      ALLOW_DESTRUCTIVE_DB_TESTS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check credentials
        id: check-secrets
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -n "$DATABASE_URL" ] && [ -n "$DATABASE_URL_ADMIN" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
            echo "All live Supabase credentials present. Remote live verification enabled."
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "Live Supabase credentials not configured in this environment; skipping remote verification."
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}

      - name: Run Genuine Supabase JWT, ES256 & Auth Membership Tests
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: |
          npx vitest run \
            apps/api/tests/real-supabase-jwt.test.ts \
            apps/api/tests/pg-auth-integration.test.ts
        env:
          ALLOW_DESTRUCTIVE_DB_TESTS: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}
          DATABASE_CA_PATH: ${{ secrets.DATABASE_CA_PATH }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
