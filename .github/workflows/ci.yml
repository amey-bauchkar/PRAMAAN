name: PRAMAAN CI & Security Verification Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-unit-tests:
    name: Build, Lint, Strict Typecheck & DB-Independent Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies (Frozen Lockfile)
        run: npm ci

      - name: Quality Gate 1 — ESLint Static Code Analysis
        run: npm run lint

      - name: Quality Gate 2 — Strict TypeScript Compilation Check
        run: npm run typecheck

      - name: Quality Gate 3 — Monorepo Production Build
        run: npm run build

      - name: Quality Gate 4 — DB-Independent Domain, Contract, API Route & Security Tests
        run: |
          npx vitest run \
            packages/domain/tests/ \
            apps/api/tests/anchor-service-and-api.test.ts \
            apps/api/tests/api-endpoints.test.ts \
            apps/api/tests/api-route-rbac.test.ts \
            apps/api/tests/auth-membership-tenant.test.ts \
            apps/api/tests/email-takeover-prevention.test.ts \
            apps/api/tests/m1-audit-chain.test.ts \
            apps/api/tests/m1-consent-ledger.test.ts \
            apps/api/tests/m1-tenancy-rls.test.ts \
            apps/api/tests/prod-fail-closed.test.ts \
            db/tests/admin-tls-and-ledger.test.ts \
            db/tests/test-safety-guard.test.ts
        env:
          NODE_ENV: test
          SUPABASE_URL: https://qshujrddrzoemlzmleru.supabase.co
          CHECKPOINT_SIGNING_KEY: ci_audit_checkpoint_secret_key_32bytes!

  isolated-postgres-integration:
    name: Isolated PostgreSQL 17 RLS & Integration Verification
    runs-on: ubuntu-latest
    env:
      ALLOW_DESTRUCTIVE_DB_TESTS: "true"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_admin_password
          POSTGRES_DB: pramaan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies (Frozen Lockfile)
        run: npm ci

      - name: Execute Idempotent Migration Runner on Clean PostgreSQL 17
        run: node scripts/migrate-supabase.mjs
        env:
          DATABASE_URL_ADMIN: postgresql://postgres:ci_test_admin_password@localhost:5432/pramaan_test

      - name: Verify Migration Idempotency Rerun on Clean DB
        run: node scripts/migrate-supabase.mjs
        env:
          DATABASE_URL_ADMIN: postgresql://postgres:ci_test_admin_password@localhost:5432/pramaan_test

      - name: Provision Restricted Runtime Role Password
        run: |
          node -e "
            import pg from 'pg';
            const pool = new pg.Pool({ connectionString: 'postgresql://postgres:ci_test_admin_password@localhost:5432/pramaan_test' });
            await pool.query(\"ALTER ROLE pramaan_app_user WITH PASSWORD 'ci_runtime_password';\");
            await pool.end();
          "

      - name: Apply Deterministic Multi-Tenant Seed
        run: node scripts/seed-demo.mjs
        env:
          DATABASE_URL_ADMIN: postgresql://postgres:ci_test_admin_password@localhost:5432/pramaan_test

      - name: Run Migration Runner & Ledger Automated Tests
        run: npx vitest run db/tests/migration-runner.test.ts
        env:
          DATABASE_URL_ADMIN: postgresql://postgres:ci_test_admin_password@localhost:5432/pramaan_test

      - name: Run Audit Chain Concurrency & Tenant Consent Tests (P1-4, P1-5)
        run: npx vitest run apps/api/tests/audit-concurrency-and-consent.test.ts
        env:
          DATABASE_URL: postgresql://pramaan_app_user:ci_runtime_password@localhost:5432/pramaan_test
          DATABASE_URL_ADMIN: postgresql://postgres:ci_test_admin_password@localhost:5432/pramaan_test

      - name: Run Consent Adversarial & Transaction Purge Tests
        run: npx vitest run apps/api/tests/consent-adversarial.test.ts
        env:
          DATABASE_URL: postgresql://pramaan_app_user:ci_runtime_password@localhost:5432/pramaan_test
          DATABASE_URL_ADMIN: postgresql://postgres:ci_test_admin_password@localhost:5432/pramaan_test

      - name: Run Restricted Runtime Role & RLS Multi-Tenant Tests
        run: npx vitest run apps/api/tests/restricted-runtime-user.test.ts
        env:
          DATABASE_URL: postgresql://pramaan_app_user:ci_runtime_password@localhost:5432/pramaan_test
          DATABASE_URL_ADMIN: postgresql://postgres:ci_test_admin_password@localhost:5432/pramaan_test

      - name: Run Connection Pool Reuse & Context Isolation Tests
        run: npx vitest run db/tests/connection-pool-reuse.test.ts
        env:
          DATABASE_URL: postgresql://pramaan_app_user:ci_runtime_password@localhost:5432/pramaan_test
          DATABASE_URL_ADMIN: postgresql://postgres:ci_test_admin_password@localhost:5432/pramaan_test

      - name: Run Comprehensive PostgreSQL 17 RLS & Verification Invariants Suite
        run: npx vitest run db/tests/supabase-real-db.test.ts
        env:
          DATABASE_URL_ADMIN: postgresql://postgres:ci_test_admin_password@localhost:5432/pramaan_test

  live-supabase-verification:
    name: Remote Live Supabase Verification (Environment-Dependent Gate)
    runs-on: ubuntu-latest
    env:
      ALLOW_DESTRUCTIVE_DB_TESTS: "true"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies (Frozen Lockfile)
        run: npm ci

      - name: Check Environment Credentials
        id: check-secrets
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -n "$DATABASE_URL" ] && [ -n "$DATABASE_URL_ADMIN" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
            echo "All live Supabase credentials present. Remote live verification enabled."
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "Live Supabase credentials not configured in this environment; skipping remote verification."
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}

      - name: Run Genuine Supabase JWT, ES256 & Auth Membership Tests
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: |
          npx vitest run \
            apps/api/tests/real-supabase-jwt.test.ts \
            apps/api/tests/pg-auth-integration.test.ts
        env:
          ALLOW_DESTRUCTIVE_DB_TESTS: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}
          DATABASE_CA_PATH: ${{ secrets.DATABASE_CA_PATH }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
